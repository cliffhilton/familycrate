<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Reset password · FamilyCrate</title>
<link rel="icon" href="/icon-192.png"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#F0F4F8;color:#1A2A38;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
img{height:56px;border-radius:12px;margin-bottom:24px}
.card{width:100%;max-width:380px;background:#FAFCFE;border:1.5px solid #D8E4EE;border-radius:18px;padding:32px 28px;box-shadow:0 8px 32px rgba(26,42,56,.1)}
h1{font-size:22px;font-weight:500;margin-bottom:4px}
p.sub{font-size:14px;color:#7A96A8;margin-bottom:22px}
label{display:block;font-size:11px;font-weight:500;color:#7A96A8;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
input{width:100%;padding:11px 13px;border-radius:9px;border:1.5px solid #D8E4EE;background:#F0F4F8;font:inherit;font-size:15px;color:#1A2A38;outline:none;margin-bottom:16px}
input:focus{border-color:#3A6A88}
button{width:100%;padding:13px;border-radius:100px;border:none;background:#3A6A88;color:#fff;font:inherit;font-size:14px;font-weight:500;cursor:pointer}
button:disabled{opacity:.6;cursor:not-allowed}
.msg{padding:9px 12px;border-radius:8px;font-size:13px;margin-bottom:14px;display:none}
.err{background:#FDEAEA;border:1.5px solid #E8B8B8;color:#CC3A3A}
.ok{background:#E6F4EA;border:1.5px solid #B8DEC2;color:#2A6A2A}
a{color:#3A6A88;text-decoration:none;font-weight:500}
.foot{text-align:center;margin-top:16px;font-size:13px;color:#7A96A8}
</style></head><body>
<img src="/icon-192.png" alt="FamilyCrate"/>
<div class="card">
<h1>Choose a new password</h1>
<p class="sub">Enter a new password for your FamilyCrate account.</p>
<div id="err" class="msg err"></div>
<div id="ok" class="msg ok"></div>
<form id="f">
<label for="pw">New password</label><input id="pw" type="password" autocomplete="new-password" placeholder="8+ characters"/>
<label for="pw2">Confirm password</label><input id="pw2" type="password" autocomplete="new-password"/>
<button id="b" type="submit">Update password</button>
</form>
<div class="foot"><a href="/login">Back to sign in</a></div>
</div>
<script>
var $=function(i){return document.getElementById(i)};
function show(id,t){$(id).textContent=t;$(id).style.display="block"}
var h=new URLSearchParams(location.hash.slice(1));
var seen=Array.from(h.keys()).concat(Array.from(new URLSearchParams(location.search).keys())).join(", ")||"nothing";
var token=h.get("access_token"),type=h.get("type"),herr=h.get("error_description");
if(herr||!token||type!=="recovery"){
  show("err",herr?"This reset link has expired or was already used. Request a new one from the sign-in page.":"This reset link is invalid (page received: "+seen+"). Request a new one from the sign-in page.");
  $("f").style.display="none";
}
history.replaceState(null,"",location.pathname);
$("f").addEventListener("submit",async function(e){
  e.preventDefault();$("err").style.display="none";
  var a=$("pw").value,b=$("pw2").value;
  if(a.length<8)return show("err","Password must be at least 8 characters.");
  if(a!==b)return show("err","Passwords don't match.");
  $("b").disabled=true;
  try{
    var r=await fetch("/api/auth/update-password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({access_token:token,password:a})});
    var d=await r.json();
    if(!r.ok)throw new Error(d.error||"Could not update password");
    $("f").style.display="none";show("ok","Password updated. Taking you to sign in…");
    setTimeout(function(){location.href="/login"},1800);
  }catch(x){show("err",x.message);$("b").disabled=false}
});
</script></body></html>
